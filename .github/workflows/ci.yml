name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:tests
      - run: pnpm test
      - run: pnpm build
      - name: Committed Vercel bundle matches the source
        run: |
          if ! git diff --exit-code -- api/index.js; then
            echo "api/index.js is stale. Run pnpm build and commit the regenerated file."
            exit 1
          fi
